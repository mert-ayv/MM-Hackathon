[project]
name = "dashboard-server"
version = "0.1.0"
description = "Read-only API over runs/ (docs/run-log.md) plus the built dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
dashboard = "dashboard_server.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard_server"]

[tool.ruff]
line-length = 120
target-version = "py311"
