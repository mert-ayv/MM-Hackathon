[project]
name = "dashboard-server"
version = "0.1.0"
description = "Read-only API over runs/ (docs/run-log.md) plus the built dashboard"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
dashboard = "dashboard_server.app:main"

[dependency-groups]
# arena-kit only for the importer's test; the server itself never imports it
dev = ["pytest>=8", "httpx>=0.27", "arena-kit"]

[tool.uv.sources]
arena-kit = { path = "../../starter-kit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard_server"]

[tool.ruff]
line-length = 120
target-version = "py312"
